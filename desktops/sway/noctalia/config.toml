# Noctalia config. Symlinked to ~/.config/noctalia/config.toml by desktops/sway/default.nix.
# Layout mirrors the GNOME setup: workspaces left, clock centre,
# resources / tray / network / volume / battery right.

[shell]
font_family = "Adwaita Sans"
polkit_agent = true
screen_time_enabled = true

[shell.panel]
# Panels (control center, calendar, tray…) open under the clicked widget, not bar-centre.
open_near_click_control_center = true
open_near_click_launcher = false

# Like GNOME: saved to ~/Pictures/Screenshots and copied to the clipboard.
[shell.screenshot]
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot From %Y-%m-%d %H-%M-%S"
save_to_file = true
copy_to_clipboard = true
confirm_region = true
remember_last_region = true

[shell.animation]
enabled = true
speed = 1.0    # 1.0 = default; higher = faster

[shell.launcher]
categories = false # hide the application category chips in the launcher
app_grid = true    # apps as an icon grid

[theme]
mode = "dark"
source = "builtin"
builtin = "Gruvbox"

[theme.templates]
enable_builtin_templates = false

[control_center]
hidden_tabs = ["weather"]
sidebar_section = "none"

[audio]
enable_overdrive = true # volume above 100%, as in GNOME

[nightlight]
enabled = true
temperature_night = 3700

[bar]
order = ["main"]

[bar.main]
position = "top"
thickness = 32
margin_ends = 0
margin_edge = 0
radius = 0
concave_edge_corners = false
shadow = false
reserve_space = true
capsule = false
scale = 1.2

start = ["taskbar"]
center = ["clock"]
end = [
    "group:res",
    "gap",
    "tray",
    "gap",
    "network",
    "bluetooth",
    "volume",
    "battery",
    "control-center",
]

# CPU / RAM / temp / disk share one capsule; clicking any of them opens
# Control Center → System (graphs and resource details).
[[bar.main.capsule_group]]
id = "res"
members = ["cpu", "ram", "temp", "disk"]
fill = "surface_variant"
padding = 8.0
widget_spacing = 12

# One capsule per workspace holding the icons of the apps open on it
# (like the GNOME "workspaces by open apps" extension).
[widget.taskbar]
group_by_workspace = true
group_single_icon_per_app = true
hide_empty_workspaces = false
workspace_group_capsule = true
workspace_group_content = "icons"
workspace_label_placement = "inside"
show_active_indicator = false
icon_scale = 1.2

[widget.clock]
format = "{:%b %-d %-I:%M %p}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
[widget.cpu.actions]
left = "panel-toggle control-center system"

[widget.ram]
type = "sysmon"
stat = "ram_pct"
[widget.ram.actions]
left = "panel-toggle control-center system"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
[widget.temp.actions]
left = "panel-toggle control-center system"

[widget.disk]
type = "sysmon"
stat = "disk_free"
path = "/"
[widget.disk.actions]
left = "panel-toggle control-center system"

[widget.gap]
type = "spacer"
length = 24

[widget.tray]
hide_passive = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[weather]
enabled = false

[battery]
warning_threshold = 20

[desktop_widgets]
enabled = false
